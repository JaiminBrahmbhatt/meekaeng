name: 'Gemini Dispatch'

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, closed]
  schedule:
    - cron: '0 * * * *' # Every hour

# Security: There are no permission grants in this workflow.

jobs:
  dispatch:
    if: |-
      !github.event.issue.pull_request
        || (github.event.issue.pull_request && contains(github.event.comment.body, '/gemini'))
        || (github.event.issue.pull_request && github.event.action == 'opened')
        || (github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/run-gemini-cli/actions/dispatch@v0
        with:
          conf: .github/gemini.yml
