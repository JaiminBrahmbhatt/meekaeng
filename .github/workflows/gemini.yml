name: Gemini Issue & PR Automation

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, synchronize]

jobs:
  gemini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gemini Review
        uses: google-gemini/github-action@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
